name: Release Build (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_label: macos-arm64
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            os_label: windows-x64
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # 1. Build Tauri bundles (.app, .dmg, setup.exe, .msi) + Updater artifacts (latest.json, .sig)
      # タグ push 時 (v*) は tauri-action が自動で GitHub Release を作成し、
      # TAURI_SIGNING_PRIVATE_KEY が設定されていればセルフアップデート用の latest.json と署名済みアーカイブも公開します
      - name: Build Tauri Application & Publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lectern ${{ github.ref_name }}"
          releaseBody: |
            ## Lectern ${{ github.ref_name }}
            Rust + Tauri 製の講義資料マークダウンエディタ & HTML/PDF 変換ツールです。

            ### ダウンロードファイル一覧
            - **macOS (Apple Silicon)**:
              - `Lectern_..._aarch64.dmg`: macOS ディスクイメージインストーラ
              - `Lectern-macos-arm64.app.zip`: 解凍してそのまま使える `Lectern.app` 本体
            - **Windows (64-bit)**:
              - `Lectern_..._x64-setup.exe`: Windows セットアップインストーラ (NSIS)
              - `Lectern_..._x64_en-US.msi`: Windows MSI インストーラ
              - `lectern-windows-x64-portable.exe`: インストール不要で単体動作するポータブル `.exe`

            ### macOS での初回起動方法（警告ダイアログが出る場合）
            本アプリは Apple の公証を行っていないため、macOS で初回起動時に「マルウェアが含まれていないことを検証できませんでした」等の警告が表示されることがあります。その場合は以下のいずれかの手順（初回のみ）で許可してください：

            **方法 1：システム設定から許可する（GUI）**
            1. `.dmg` を開き、`Lectern.app` を **アプリケーション（`/Applications`）** フォルダへコピーします。
            2. `Lectern` を一度起動し、警告ダイアログが出たら **「完了」** で閉じます。
            3. **システム設定** → **プライバシーとセキュリティ** を開き、下へスクロールして「“Lectern”は開発元を確認できないためブロックされました」の横にある **「このまま開く」** をクリックします。
            4. 確認ダイアログでもう一度 **「このまま開く」** を選び、パスワードまたは Touch ID で認証すると起動します（2 回目以降はそのまま起動できます）。

            **方法 2：ターミナルから検疫属性を解除する**
            `/Applications` へコピーした後、ターミナルで以下を 1 回実行します：
            ```bash
            xattr -cr /Applications/Lectern.app
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && format('{0} --config {1}', matrix.args, '{"bundle":{"createUpdaterArtifacts":true}}') || matrix.args }}

      # 2. macOS: Lectern.app を Finder でそのまま解凍して使える .app.zip にパッケージング
      - name: Archive Lectern.app as zip (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Lectern.app" "Lectern-macos-arm64.app.zip"

      # 3. Windows: 単体実行可能なポータブル .exe を分かりやすい名前にコピー
      - name: Prepare portable .exe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/lectern.exe" "src-tauri/target/release/lectern-windows-x64-portable.exe"

      # 4. タグ push 時 (v*) は、単体 .app.zip とポータブル .exe も同じ GitHub Release に追加登録
      - name: Attach standalone .app.zip and portable .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lectern-macos-arm64.app.zip
            src-tauri/target/release/lectern-windows-x64-portable.exe

      # 5. Actions タブからの手動ビルド時にも Artifacts からダウンロード可能にする
      - name: Upload built bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lectern-${{ matrix.os_label }}
          path: |
            src-tauri/target/**/release/bundle/macos/Lectern-macos-arm64.app.zip
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/lectern-windows-x64-portable.exe
