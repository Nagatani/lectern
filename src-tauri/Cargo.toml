[package]
name = "lectern"
version = "0.1.0"
description = "Lectern — Rust & Tauri Lecture Markdown Editor and HTML/PDF Converter"
authors = ["Lectern Contributors"]
edition = "2021"

[lib]
name = "lectern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
syntect = "5.2"
rfd = "0.15"
